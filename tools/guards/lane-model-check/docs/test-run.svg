<text x="20" y="146" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> --all catches a later turn on another model and counts turns per model (58.3344ms)</text>
<text x="20" y="166" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> not yet: a missing transcript, or one with no model turn, exits 3 (poll again) (119.922ms)</text>
<text x="20" y="186" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> readModels rejects with the error code when the file cannot be opened (never a silent empty result</text>
<text x="20" y="206" xml:space="preserve">  ) (0.6875ms)</text>
<text x="20" y="226" xml:space="preserve">﹣ an unreadable transcript exits 2 (error), never 1 (mismatch) (0.5387ms) # needs a non-root POSIX u</text>
<text x="20" y="246" xml:space="preserve">  ser</text>
<text x="20" y="266" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> a torn last line (still being written) is skipped, not fatal (3.8635ms)</text>
<text x="20" y="286" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> --session finds &lt;id&gt;.jsonl in any subfolder of a configured folder, and rejects path tricks (126.4</text>
<text x="20" y="306" xml:space="preserve">  864ms)</text>
<text x="20" y="326" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> --plan/--lane reads the expected model, ids case-insensitive, arrays or keyed objects (63.5502ms)</text>
<text x="20" y="346" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> another agent format is a config change: turn marker and model path (69.536ms)</text>
