<text x="20" y="66" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node --test</tspan></text>
<text x="20" y="86" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> model matching: equal, or the expected id plus a separator; never a longer word (0.9935ms)</text>
