<svg xmlns="http://www.w3.org/2000/svg" width="880" height="414" viewBox="0 0 880 414" role="img" aria-label="lane-model-check: is the lane on the model it was asked for?">
<rect x="0.5" y="0.5" width="879" height="413" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M10.5 0.5h859a10 10 0 0 1 10 10v22h-879v-22a10 10 0 0 1 10-10z" fill="#161b22"/>
<circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
<text x="440" y="21" text-anchor="middle" fill="#7d8590" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13">lane-model-check: is the lane on the model it was asked for?</text>
<g font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9">
<text x="20" y="66" xml:space="preserve"><tspan fill="#7d8590"># a lane's JSONL transcript (Claude Code format): its first real turn ran model-small-20261001</tspan></text>
<text x="20" y="86" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node lane-model-check.mjs --transcript examples/transcript.example.jsonl --expect model-small</tspan></text>
<text x="20" y="106" xml:space="preserve">{"ok":true,"verdict":"match","expected":"model-small","transcript":".\\examples\\transcript.example.</text>
<text x="20" y="126" xml:space="preserve">  jsonl","lane":null,"session":null,"actual":"model-small-20261001","line":4}</text>
<text x="20" y="146" xml:space="preserve"><tspan fill="#7d8590"># exit 0</tspan></text>
<text x="20" y="166" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node lane-model-check.mjs --transcript examples/transcript.example.jsonl --plan examples/plan.exam</tspan></text>
<text x="20" y="186" xml:space="preserve">  ple.json --lane design-review --explain</text>
<text x="20" y="206" xml:space="preserve">lane-model-check: MISMATCH expected model-large, got model-small-20261001</text>
<text x="20" y="226" xml:space="preserve"><tspan fill="#7d8590"># exit 1  mismatch: the plan says model-large</tspan></text>
<text x="20" y="246" xml:space="preserve"><tspan fill="#7d8590"># --all reads every turn: a later turn fell back to another model</tspan></text>
<text x="20" y="266" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node lane-model-check.mjs --transcript examples/transcript.example.jsonl --expect model-small --al</tspan></text>
<text x="20" y="286" xml:space="preserve">  l --explain</text>
<text x="20" y="306" xml:space="preserve">lane-model-check: MISMATCH expected model-small, got model-large-20261001</text>
<text x="20" y="326" xml:space="preserve"><tspan fill="#7d8590"># exit 1</tspan></text>
<text x="20" y="346" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node lane-model-check.mjs --session lane-not-started-yet --expect model-small --explain</tspan></text>
<text x="20" y="366" xml:space="preserve">lane-model-check: PENDING no transcript yet for session lane-not-started-yet</text>
<text x="20" y="386" xml:space="preserve"><tspan fill="#7d8590"># exit 3  (3 = not yet: poll again)</tspan></text>
</g>
</svg>
