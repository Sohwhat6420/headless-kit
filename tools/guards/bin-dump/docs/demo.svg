<svg xmlns="http://www.w3.org/2000/svg" width="880" height="454" viewBox="0 0 880 454" role="img" aria-label="bin-dump: move to a rubbish bin, never delete">
<rect x="0.5" y="0.5" width="879" height="453" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M10.5 0.5h859a10 10 0 0 1 10 10v22h-879v-22a10 10 0 0 1 10-10z" fill="#161b22"/>
<circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
<text x="440" y="21" text-anchor="middle" fill="#7d8590" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13">bin-dump: move to a rubbish bin, never delete</text>
<g font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9">
<text x="20" y="66" xml:space="preserve"><tspan fill="#7d8590"># BIN_DUMP_DIR=&lt;tmp&gt;/bin; an agent clears an old build and a draft, and tries a git repository</tspan></text>
<text x="20" y="86" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node bin-dump.mjs old-build notes-draft.txt repo --who build-agent --why "stale build output"</tspan></text>
<text x="20" y="106" xml:space="preserve">[bin-dump] moved &lt;tmp&gt;\old-build (46.9 KB) -&gt; &lt;tmp&gt;\bin\2026-11-11_build-agent\C\&lt;tmp&gt;\old-build</text>
<text x="20" y="126" xml:space="preserve">[bin-dump] moved &lt;tmp&gt;\notes-draft.txt (6 B) -&gt; &lt;tmp&gt;\bin\2026-11-11_build-agent\C\&lt;tmp&gt;\notes-draft</text>
<text x="20" y="146" xml:space="preserve">  .txt</text>
<text x="20" y="166" xml:space="preserve">[bin-dump] REFUSED &lt;tmp&gt;\repo: is (or holds) a git repository or worktree; remove a worktree with `g</text>
<text x="20" y="186" xml:space="preserve">  it worktree remove`, or pass --allow-clean-clones for throwaway clones.</text>
<text x="20" y="206" xml:space="preserve">[bin-dump] 2 moved, 46.9 KB; 1 refused or failed. Bin: &lt;tmp&gt;\bin</text>
<text x="20" y="226" xml:space="preserve"><tspan fill="#7d8590"># exit 1  (1 = something was refused; the rest still moved)</tspan></text>
<text x="20" y="246" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node bin-dump.mjs --status</tspan></text>
<text x="20" y="266" xml:space="preserve">{"bin":"&lt;tmp&gt;\\bin","exists":true,"bytes":49403,"entries":2,"recent":[{"at":"2026-11-11T06:08:55.409</text>
<text x="20" y="286" xml:space="preserve">  Z","action":"move","who":"build-agent","bytes":"48015","original":"&lt;tmp&gt;\\old-build","bin_path":"&lt;tm</text>
<text x="20" y="306" xml:space="preserve">  p&gt;\\bin\\2026-11-11_build-agent\\C\\&lt;tmp&gt;\\old-build","why":…</text>
<text x="20" y="326" xml:space="preserve"><tspan fill="#7d8590"># exit 0</tspan></text>
<text x="20" y="346" xml:space="preserve"><tspan fill="#7d8590"># changed its mind: put the draft back where it was</tspan></text>
<text x="20" y="366" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node bin-dump.mjs --restore bin/2026-11-11_build-agent/C/&lt;tmp&gt;/notes-draft.txt --who build-agent</tspan></text>
<text x="20" y="386" xml:space="preserve">[bin-dump] restored &lt;tmp&gt;\bin\2026-11-11_build-agent\C\&lt;tmp&gt;\notes-draft.txt -&gt; &lt;tmp&gt;\notes-draft.tx</text>
<text x="20" y="406" xml:space="preserve">  t</text>
<text x="20" y="426" xml:space="preserve"><tspan fill="#7d8590"># exit 0</tspan></text>
</g>
</svg>
