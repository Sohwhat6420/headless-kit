<svg xmlns="http://www.w3.org/2000/svg" width="939" height="534" viewBox="0 0 939 534" role="img" aria-label="bin-dump: offline test suite">
<rect x="0.5" y="0.5" width="938" height="533" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M10.5 0.5h918a10 10 0 0 1 10 10v22h-938v-22a10 10 0 0 1 10-10z" fill="#161b22"/>
<circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
<text x="469.5" y="21" text-anchor="middle" fill="#7d8590" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13">bin-dump: offline test suite</text>
<g font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9">
<text x="20" y="66" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node --test</tspan></text>
<text x="20" y="86" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> a folder moves with its tree intact, under &lt;date&gt;_&lt;who&gt;/&lt;drive&gt;/&lt;path&gt;, with one manifest row (72.6152ms)</text>
<text x="20" y="106" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> the same path again gets a ~2 suffix and never overwrites (62.3883ms)</text>
<text x="20" y="126" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> refusals: each exits 1, keeps the path where it is and writes no manifest row (685.888ms)</text>
<text x="20" y="146" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> protected paths from the config are refused, and so is anything containing them; files inside are not (29</text>
<text x="20" y="166" xml:space="preserve">  2.9155ms)</text>
<text x="20" y="186" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> usage errors exit 2 and move nothing (715.1623ms)</text>
<text x="20" y="206" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> --dry-run moves nothing; a single file moves; a mixed batch moves the good one and exits 1 (239.3559ms)</text>
<text x="20" y="226" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> --allow-clean-clones passes a clean clone and still refuses a dirty one and a linked worktree (588.3178ms</text>
<text x="20" y="246" xml:space="preserve">  )</text>
<text x="20" y="266" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> a who name loses characters a folder name cannot keep, and its trailing dots (66.4825ms)</text>
<text x="20" y="286" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> a read-only manifest does not lose the record: a pending manifest is written instead (68.7679ms)</text>
<text x="20" y="306" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> --restore moves an entry back and refuses when something is in the way (460.7539ms)</text>
<text x="20" y="326" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">✔</tspan> --status reports the bin as JSON; --help exits 0 (241.6644ms)</text>
<text x="20" y="346" xml:space="preserve">ℹ tests 11</text>
<text x="20" y="366" xml:space="preserve">ℹ suites 0</text>
<text x="20" y="386" xml:space="preserve">ℹ pass 11</text>
<text x="20" y="406" xml:space="preserve">ℹ <tspan fill="#3fb950" font-weight="700">fail 0</tspan></text>
<text x="20" y="426" xml:space="preserve">ℹ cancelled 0</text>
<text x="20" y="446" xml:space="preserve">ℹ skipped 0</text>
<text x="20" y="466" xml:space="preserve">ℹ todo 0</text>
<text x="20" y="486" xml:space="preserve">ℹ duration_ms 3654.2283</text>
<text x="20" y="506" xml:space="preserve"><tspan fill="#7d8590"># exit 0</tspan></text>
</g>
</svg>
