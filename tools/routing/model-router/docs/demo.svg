<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="734" viewBox="0 0 1048 734" role="img" aria-label="model-router: rank pools by use-it-or-lose-it urgency">
<rect x="0.5" y="0.5" width="1047" height="733" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M10.5 0.5h1027a10 10 0 0 1 10 10v22h-1047v-22a10 10 0 0 1 10-10z" fill="#161b22"/>
<circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
<text x="524" y="21" text-anchor="middle" fill="#7d8590" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13">model-router: rank pools by use-it-or-lose-it urgency</text>
<g font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9">
<text x="20" y="66" xml:space="preserve"><tspan fill="#7d8590"># five pools from examples/config.example.json, usage from examples/usage.example.json, clock fixed for the demo</tspan></text>
<text x="20" y="86" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node model-router.mjs --task bulk --explain --config examples/config.example.json --at 2026-11-19T08:00:00Z 2&gt;&amp;1 &gt;/dev</tspan></text>
<text x="20" y="106" xml:space="preserve">  /null</text>
<text x="20" y="126" xml:space="preserve">rank  pool          kind          model             ok   used  line  budget  hrs  urgency  tier  reason</text>
<text x="20" y="146" xml:space="preserve">----  ------------  ------------  ----------------  ---  ----  ----  ------  ---  -------  ----  -----------------------</text>
<text x="20" y="166" xml:space="preserve">  ----------------------------</text>
<text x="20" y="186" xml:space="preserve">1     api-main      api           medium-model      yes  40.0  84.9  100     112  0.674    2     final 7 days and behind</text>
<text x="20" y="206" xml:space="preserve">   its line: before free pools</text>
<text x="20" y="226" xml:space="preserve">2     free-tier     free          small-fast-model  yes  -     -     -       -    0.200    1     free pool, fixed urgenc</text>
<text x="20" y="246" xml:space="preserve">  y 0.2</text>
<text x="20" y="266" xml:space="preserve">3     api-team      api           medium-model      yes  2.0   10.6  50      568  0.051    1     behind its line, over 7</text>
<text x="20" y="286" xml:space="preserve">   days to reset</text>
<text x="20" y="306" xml:space="preserve">-     subscription  subscription  medium-model      no   93.0  89.3  100     18   -        -     ahead of its line: last</text>
<text x="20" y="326" xml:space="preserve">   resort only</text>
<text x="20" y="346" xml:space="preserve">-     local         local         local-8b          no   -     -     -       -    -        -     private work only</text>
<text x="20" y="366" xml:space="preserve"></text>
<text x="20" y="386" xml:space="preserve">pick: api-main (medium-model)   fallback: free-tier   batch: true   chain: api-main &gt; free-tier &gt; api-team</text>
<text x="20" y="406" xml:space="preserve"></text>
<text x="20" y="426" xml:space="preserve"><tspan fill="#7d8590"># a person is waiting: same pick, real-time instead of Batch (stdout is one JSON line, trimmed to five fields here)</tspan></text>
<text x="20" y="446" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node model-router.mjs --task bulk --human-waiting --config examples/config.example.json --at 2026-11-19T08:00:00Z | no</tspan></text>
<text x="20" y="466" xml:space="preserve">  de -p '...'</text>
<text x="20" y="486" xml:space="preserve">{"pool":"api-main","model":"medium-model","batch":false,"chain":["api-main","free-tier","api-team"],"private":false}</text>
<text x="20" y="506" xml:space="preserve"></text>
<text x="20" y="526" xml:space="preserve"><tspan fill="#7d8590"># private work: every pool without "private": true refuses it</tspan></text>
<text x="20" y="546" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node model-router.mjs --task bulk --private --config examples/config.example.json --at 2026-11-19T08:00:00Z | node -p </tspan></text>
<text x="20" y="566" xml:space="preserve">  '...'</text>
<text x="20" y="586" xml:space="preserve">{"pool":"local","model":"local-8b","batch":false,"chain":["local"],"private":true}</text>
<text x="20" y="606" xml:space="preserve"></text>
<text x="20" y="626" xml:space="preserve"><tspan fill="#7d8590"># an hour later every reading is past staleMinutes and no free pool serves judgement: exit 3 (trimmed)</tspan></text>
<text x="20" y="646" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node model-router.mjs --task judgement --config examples/config.example.json --at 2026-11-19T09:00:00Z; echo "exit $?"</tspan></text>
<text x="20" y="666" xml:space="preserve">{"stale":true,"stale_pools":["subscription","api-main","api-team"],"how":"refresh those pools' readings in the usage fil</text>
<text x="20" y="686" xml:space="preserve">  e, then route again"}</text>
<text x="20" y="706" xml:space="preserve">exit 3</text>
</g>
</svg>
