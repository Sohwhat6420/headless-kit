<text x="20" y="126" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 3 - scan: totals deduplicated by message id + request id across files, nested subagent logs inclu</text>
<text x="20" y="146" xml:space="preserve">  ded</text>
<text x="20" y="166" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 4 - by month, and an inclusive --since/--until window</text>
<text x="20" y="186" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 5 - another JSONL source through a field map: epoch timestamps, its own dedup, junk skipped</text>
<text x="20" y="206" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 6 - ledger: adds days, never lowers one when logs are deleted, raises one that grew, dry run writ</text>
<text x="20" y="226" xml:space="preserve">  es nothing</text>
<text x="20" y="246" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 7 - archive: gzip copies that round-trip, unchanged files skipped, changed ones rewritten</text>
<text x="20" y="266" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 8 - settings: precedence, defaults, and refusing a ledger or archive inside a log folder</text>
<text x="20" y="286" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 9 - CLI: one JSON object, --table, --help, usage and no-logs exit codes; the logs are never modif</text>
<text x="20" y="306" xml:space="preserve">  ied</text>
