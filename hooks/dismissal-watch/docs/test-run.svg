<svg xmlns="http://www.w3.org/2000/svg" width="964" height="514" viewBox="0 0 964 514" role="img" aria-label="dismissal-watch: node --test (offline)">
<rect x="0.5" y="0.5" width="963" height="513" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M10.5 0.5h943a10 10 0 0 1 10 10v22h-963v-22a10 10 0 0 1 10-10z" fill="#161b22"/>
<circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
<text x="482" y="21" text-anchor="middle" fill="#7d8590" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13">dismissal-watch: node --test (offline)</text>
<g font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9">
<text x="20" y="66" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node --test</tspan></text>
<text x="20" y="86" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 1 - warns when the reply dismisses a possibility question and no search ran</text>
<text x="20" y="106" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 2 - a search in the same turn silences it (WebSearch, WebFetch, browser read, gh search, research skill, we</text>
<text x="20" y="126" xml:space="preserve">  b brief)</text>
<text x="20" y="146" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 3 - tool calls that are not searches are not credited</text>
<text x="20" y="166" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 4 - a search in an EARLIER turn does not count</text>
<text x="20" y="186" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 5 - silent when the reply does not dismiss, says "not impossible", or only quotes the word</text>
<text x="20" y="206" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 6 - flags the wider set of dismissal phrases</text>
<text x="20" y="226" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 7 - by default only fires when the prompt asked whether something can be done</text>
<text x="20" y="246" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 8 - possibility prompts: positives and routine requests</text>
<text x="20" y="266" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 9 - last_assistant_message from the hook input wins over a lagging transcript</text>
<text x="20" y="286" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 10 - opt-in modes: feedback continues via additionalContext, block via decision; both respect stop_hook_act</text>
<text x="20" y="306" xml:space="preserve">  ive</text>
<text x="20" y="326" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 11 - config: custom phrases, search tools and message</text>
<text x="20" y="346" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 12 - notes: stale notes are pruned on write; an invalid session id warns but writes nothing</text>
<text x="20" y="366" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 13 - tail read: a prompt 3 MB back is found by doubling the window; a 30 MB transcript stays fast</text>
<text x="20" y="386" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 14 - fails open: malformed or unrelated input, a missing or directory transcript give no output and exit 0</text>
<text x="20" y="406" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">ok</tspan> 15 - --help and --judge work as a CLI</text>
<text x="20" y="426" xml:space="preserve"><tspan fill="#7d8590"># tests 15</tspan></text>
<text x="20" y="446" xml:space="preserve"><tspan fill="#7d8590"># pass 15</tspan></text>
<text x="20" y="466" xml:space="preserve"><tspan fill="#7d8590"># fail 0</tspan></text>
<text x="20" y="486" xml:space="preserve"><tspan fill="#7d8590"># duration 9.9 s</tspan></text>
</g>
</svg>
