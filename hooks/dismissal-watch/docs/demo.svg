<svg xmlns="http://www.w3.org/2000/svg" width="964" height="554" viewBox="0 0 964 554" role="img" aria-label="dismissal-watch: a no without a search gets flagged">
<rect x="0.5" y="0.5" width="963" height="553" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M10.5 0.5h943a10 10 0 0 1 10 10v22h-963v-22a10 10 0 0 1 10-10z" fill="#161b22"/>
<circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
<text x="482" y="21" text-anchor="middle" fill="#7d8590" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13">dismissal-watch: a no without a search gets flagged</text>
<g font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9">
<text x="20" y="66" xml:space="preserve"><tspan fill="#7d8590"># The user asked whether something is possible; the reply said no and no search ran</tspan></text>
<text x="20" y="86" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node dismissal-watch.mjs --judge examples/transcript-dismissed.jsonl</tspan></text>
<text x="20" y="106" xml:space="preserve">{"dismissed":true,"searched":false,"asksPossibility":true,"warn":true}</text>
<text x="20" y="126" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node dismissal-watch.mjs &lt; examples/stop-dismissed.json</tspan></text>
<text x="20" y="146" xml:space="preserve"><tspan fill="#7d8590"># stdout, decoded for reading (exit 0):</tspan></text>
<text x="20" y="166" xml:space="preserve">systemMessage: [dismissal-watch] The last reply said no without searching. Search (GitHub, the web, forums, pa</text>
<text x="20" y="186" xml:space="preserve">  pers) and report what exists, and the closest analogues, before saying it cannot be done.</text>
<text x="20" y="206" xml:space="preserve"><tspan fill="#7d8590"># Warn mode: the user sees the systemMessage; the model is not forced to continue.</tspan></text>
<text x="20" y="226" xml:space="preserve"></text>
<text x="20" y="246" xml:space="preserve"><tspan fill="#7d8590"># On the next prompt the model gets the note, once</tspan></text>
<text x="20" y="266" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node dismissal-watch.mjs &lt; examples/next-prompt.json</tspan></text>
<text x="20" y="286" xml:space="preserve"><tspan fill="#7d8590"># stdout, decoded for reading (exit 0):</tspan></text>
<text x="20" y="306" xml:space="preserve">hookSpecificOutput.hookEventName: UserPromptSubmit</text>
<text x="20" y="326" xml:space="preserve">hookSpecificOutput.additionalContext: [dismissal-watch] The last reply said no without searching. Search (GitH</text>
<text x="20" y="346" xml:space="preserve">  ub, the web, forums, papers) and report what exists, and the closest analogues, before saying it cannot be don</text>
<text x="20" y="366" xml:space="preserve">  e.</text>
<text x="20" y="386" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node dismissal-watch.mjs &lt; examples/next-prompt.json</tspan></text>
<text x="20" y="406" xml:space="preserve"><tspan fill="#7d8590"># stdout, decoded for reading (exit 0):</tspan></text>
<text x="20" y="426" xml:space="preserve">(no output)</text>
<text x="20" y="446" xml:space="preserve"></text>
<text x="20" y="466" xml:space="preserve"><tspan fill="#7d8590"># Same question, but the turn ran WebSearch before answering: silent</tspan></text>
<text x="20" y="486" xml:space="preserve"><tspan fill="#d2a8ff">$ </tspan><tspan fill="#79c0ff">node dismissal-watch.mjs &lt; examples/stop-searched.json</tspan></text>
<text x="20" y="506" xml:space="preserve"><tspan fill="#7d8590"># stdout, decoded for reading (exit 0):</tspan></text>
<text x="20" y="526" xml:space="preserve">(no output)</text>
</g>
</svg>
